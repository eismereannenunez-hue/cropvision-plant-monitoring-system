<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CropVision — Smarter Monitoring. Better Harvest.</title>
<style>
  :root{
    --green-900:#0f3d24;
    --green-800:#14492c;
    --green-700:#1b5e3a;
    --green-600:#217a45;
    --green-500:#2e9153;
    --green-400:#3fae63;
    --green-100:#eaf6ee;
    --green-50:#f4faf6;
    --ink:#16241c;
    --ink-soft:#5b6b62;
    --line:#dfe9e2;
    --paper:#ffffff;
    --amber:#e08e2b;
    --red:#c9482f;
    --shadow: 0 1px 2px rgba(15,61,36,.06), 0 8px 24px rgba(15,61,36,.06);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Iowan Old Style","Palatino Linotype","Georgia",serif;
    background: var(--green-50);
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .sans{ font-family: "Segoe UI","Helvetica Neue",Arial,sans-serif; }
  h1,h2,h3,h4{ font-family:"Iowan Old Style","Palatino Linotype","Georgia",serif; margin:0; letter-spacing:-0.01em;}
  p,span,div,button,input,select,textarea,label,td,th,li{ font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; }
  button{ cursor:pointer; font-weight:600; border:none; }
  a{ text-decoration:none; color:inherit; }
  ::selection{ background: var(--green-100); }

  /* ---------- Top marketing nav ---------- */
  .topnav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px; background:var(--paper); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:50;
  }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:19px; color:var(--green-800); }
  .brand .leaf{ width:22px; height:22px; }
  .topnav nav{ display:flex; gap:30px; }
  .topnav nav a{ font-size:14.5px; color:var(--ink); font-weight:500; padding:6px 2px; border-bottom:2px solid transparent; }
  .topnav nav a:hover{ border-color: var(--green-400); }
  .topnav .cta{ display:flex; gap:10px; }
  .btn{ padding:10px 18px; border-radius:9px; font-size:14px; font-weight:600; transition:transform .12s ease, box-shadow .12s ease; }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background:var(--green-700); color:#fff; }
  .btn-primary:hover{ background:var(--green-600); }
  .btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--green-400); }
  .btn-outline{ background:#fff; color:var(--green-700); border:1.5px solid var(--green-700); }
  .btn-outline:hover{ background:var(--green-50); }
  .btn-sm{ padding:7px 12px; font-size:13px; border-radius:7px; }
  .btn-danger-text{ background:transparent; color:var(--red); padding:6px 10px; font-size:13px; }

  /* ---------- Hero ---------- */
  .hero{ position:relative; padding:70px 40px 60px; overflow:hidden; background:
    radial-gradient(1200px 500px at 80% -10%, rgba(63,174,99,.16), transparent 60%), var(--green-50); }
  .hero-inner{ max-width:1240px; margin:0 auto; display:grid; grid-template-columns:1.05fr .95fr; gap:56px; align-items:center;}
  .eyebrow{ color:var(--green-600); font-weight:700; letter-spacing:.02em; font-size:13.5px; margin-bottom:14px;}
  .hero h1{ font-size:52px; line-height:1.08; color:var(--ink); }
  .hero h1 .accent{ color:var(--green-600); display:block; }
  .hero p.lede{ font-size:17px; color:var(--ink-soft); line-height:1.65; max-width:480px; margin:22px 0 30px;}
  .hero-actions{ display:flex; gap:14px; }
  .hero-art{ position:relative; border-radius:22px; overflow:hidden; box-shadow:var(--shadow); min-height:360px;
    background: linear-gradient(160deg,#2c5a3a,#173a26); display:flex; align-items:center; justify-content:center;}
  .hero-art svg{ width:100%; height:100%; }
  .scan-tag{ position:absolute; top:26px; right:26px; background:#fff; border-radius:12px; padding:12px 16px; box-shadow:var(--shadow); font-size:13px; min-width:150px;}
  .scan-tag .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--red); margin-right:6px;}
  .scan-tag b{ display:block; margin-top:2px; }
  .feat-strip{ max-width:1240px; margin:56px auto 0; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; padding:0 0;}
  .feat-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:22px 20px; }
  .feat-card .ico{ width:34px; height:34px; border-radius:9px; background:var(--green-100); display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
  .feat-card h4{ font-size:15.5px; margin-bottom:5px; }
  .feat-card p{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0;}
  .strip-caption{ text-align:center; color:var(--ink-soft); font-size:13px; margin-top:30px; letter-spacing:.02em;}

  .about-section{ max-width:1000px; margin:0 auto; padding:70px 40px 90px; }
  .about-section h2{ font-size:30px; margin-bottom:14px; }
  .about-section p{ font-size:15.5px; color:var(--ink-soft); line-height:1.7; max-width:680px; }
  .pillars{ display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:36px;}
  .pillar{ text-align:center; }
  .pillar .ico{ width:44px; height:44px; border-radius:50%; background:var(--green-100); margin:0 auto 10px; display:flex; align-items:center; justify-content:center;}
  .pillar h4{ font-size:14.5px; }
  .footer-note{ text-align:center; padding:26px; color:#fff; background:var(--green-800); font-size:13.5px; }

  /* ---------- App shell ---------- */
  .app-shell{ display:flex; min-height:100vh; }
  .sidebar{ width:236px; background:var(--green-800); color:#e7f2ea; flex-shrink:0; display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; }
  .sidebar .brand{ color:#fff; padding:6px 10px 20px; font-size:17px; }
  .sidebar .user{ display:flex; align-items:center; gap:10px; padding:10px; background:rgba(255,255,255,.06); border-radius:10px; margin-bottom:16px;}
  .sidebar .user .av{ width:34px; height:34px; border-radius:50%; background:var(--green-500); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
  .sidebar .user .name{ font-size:13.5px; font-weight:600; }
  .sidebar .user .role{ font-size:11.5px; color:#b9d3c3; }
  .side-link{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px; font-size:14px; color:#cfe4d8; margin-bottom:2px; }
  .side-link:hover{ background:rgba(255,255,255,.07); color:#fff; }
  .side-link.active{ background:var(--green-500); color:#fff; }
  .side-link .ic{ width:17px; text-align:center; opacity:.9; }
  .side-bottom{ margin-top:auto; padding-top:10px; border-top:1px solid rgba(255,255,255,.12); }

  .main{ flex:1; padding:28px 34px 60px; max-width:1400px; }
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; gap:20px;}
  .page-head h1{ font-size:26px; }
  .page-head p{ color:var(--ink-soft); font-size:14px; margin-top:6px; max-width:560px;}
  .weather-chip{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 16px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft); box-shadow:var(--shadow);}
  .weather-chip b{ font-size:19px; color:var(--ink); }

  .grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
  .stat-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:18px 20px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);}
  .stat-card .ic{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; }
  .stat-card .num{ font-size:22px; font-weight:700; font-family:"Iowan Old Style",Georgia,serif; }
  .stat-card .lbl{ font-size:12.5px; color:var(--ink-soft); }

  .card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:20px 22px; box-shadow:var(--shadow); }
  .card h3{ font-size:16px; margin-bottom:14px; }
  .card-flex-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .thumb-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px;}
  .thumb{ border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .thumb .img{ height:78px; background-size:cover; background-position:center; }
  .thumb .cap{ padding:8px 9px; }
  .thumb .cap .name{ font-size:12.5px; font-weight:700; }
  .thumb .cap .tag{ font-size:11px; margin-top:2px; }

  .tag{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .tag-ripe{ background:#fdeceb; color:var(--red); }
  .tag-near{ background:#fdf3e3; color:var(--amber); }
  .tag-unripe{ background:var(--green-100); color:var(--green-700); }
  .tag-ready{ background:#fdeceb; color:var(--red); }
  .tag-monitoring{ background:#eaf0fd; color:#3454c9; }
  .tag-fruiting{ background:#f3e9fb; color:#7a3fc9; }
  .tag-flowering{ background:#fdf3e3; color:var(--amber); }
  .tag-vegetative{ background:var(--green-100); color:var(--green-700); }
  .tag-healthy{ background:var(--green-100); color:var(--green-700); }
  .tag-attention{ background:#fdeceb; color:var(--red); }

  .tabs{ display:flex; gap:6px; background:var(--green-100); border-radius:10px; padding:4px; width:max-content; margin-bottom:18px;}
  .tab-btn{ padding:8px 18px; border-radius:8px; background:transparent; font-size:13.5px; color:var(--green-800); }
  .tab-btn.active{ background:#fff; box-shadow:var(--shadow); }

  .upload-box{ border:1.5px dashed var(--line); border-radius:14px; min-height:280px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:var(--green-50); overflow:hidden; position:relative;}
  .upload-box img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .upload-box .hint{ color:var(--ink-soft); font-size:13.5px; z-index:1; text-align:center; padding:0 30px;}
  .upload-box .hint b{ display:block; color:var(--ink); font-size:14.5px; margin-bottom:4px;}

  .confidence-bar{ height:8px; background:var(--green-100); border-radius:6px; overflow:hidden; margin:10px 0;}
  .confidence-fill{ height:100%; background: linear-gradient(90deg,var(--green-500),var(--green-700)); }

  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--line);}
  tbody td{ padding:13px 12px; border-bottom:1px solid var(--line); font-size:13.8px; }
  tbody tr:hover{ background:var(--green-50); }
  .row-actions{ display:flex; gap:8px; }
  .icon-btn{ width:28px; height:28px; border-radius:7px; background:var(--green-50); display:flex; align-items:center; justify-content:center; border:1px solid var(--line); font-size:13px;}
  .icon-btn:hover{ background:var(--green-100); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(15,30,20,.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .modal{ background:#fff; border-radius:16px; width:100%; max-width:520px; padding:26px 28px; box-shadow:0 30px 60px rgba(0,0,0,.25); max-height:88vh; overflow:auto;}
  .modal h3{ font-size:18px; margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fbfdfc;}
  .field input:focus, .field select:focus{ outline:2px solid var(--green-400); outline-offset:1px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

  .rec-card{ display:flex; gap:16px; align-items:flex-start; }
  .rec-card .ic-circle{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
  .suggest-list{ list-style:none; padding:0; margin:10px 0 0; font-size:13px; color:var(--ink-soft);}
  .suggest-list li{ margin-bottom:6px; padding-left:18px; position:relative; }
  .suggest-list li:before{ content:"✓"; position:absolute; left:0; color:var(--green-600); font-weight:700;}

  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--green-800); color:#fff; padding:12px 22px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); z-index:400; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty .ic{ font-size:30px; margin-bottom:10px; }

  .donut-wrap{ display:flex; align-items:center; gap:22px; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:8px;}
  .legend-row{ display:flex; align-items:center; justify-content:space-between; font-size:13px; margin-bottom:8px; }

  .harvest-card{ display:flex; flex-direction:column; gap:14px; }
  .harvest-card .top{ display:flex; align-items:center; gap:12px; }
  .harvest-card .ic{ width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:19px; }

  @media (max-width: 980px){
    .hero-inner{ grid-template-columns:1fr; }
    .feat-strip{ grid-template-columns:repeat(2,1fr); }
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; flex-wrap:wrap; }
    .grid-4{ grid-template-columns:repeat(2,1fr); }
    .grid-2{ grid-template-columns:1fr; }
    .pillars{ grid-template-columns:repeat(2,1fr); }
  }

  /* ---------- Animation ---------- */
  @keyframes fadeSlideUp{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes pageFade{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes scanMove{ 0%{ transform:translateY(-110%);} 100%{ transform:translateY(110%);} }
  @keyframes pulseSoft{ 0%{ opacity:.55;} 100%{ opacity:1;} }
  @keyframes drawPath{ to{ stroke-dashoffset:0; } }
  @keyframes growBar{ to{ transform:scaleY(1); } }
  @keyframes fillBar{ from{ width:0; } to{ width:var(--target); } }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(10px) scale(.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
  @keyframes fadeIn{ from{ opacity:0;} to{ opacity:1;} }
  @keyframes popIn{ from{ opacity:0; transform:scale(.9);} to{ opacity:1; transform:scale(1);} }

  #root > *{ animation: pageFade .4s ease; }

  .hero-anim > *{ opacity:0; animation:fadeSlideUp .6s ease forwards; }
  .hero-anim .eyebrow{ animation-delay:.05s; }
  .hero-anim h1{ animation-delay:.15s; }
  .hero-anim p.lede{ animation-delay:.28s; }
  .hero-anim .hero-actions{ animation-delay:.4s; }
  .hero-art{ opacity:0; animation:fadeSlideUp .7s ease forwards; animation-delay:.22s; }
  .feat-card{ opacity:0; animation:fadeSlideUp .5s ease forwards; }
  .feat-strip .feat-card:nth-child(1){ animation-delay:.5s; }
  .feat-strip .feat-card:nth-child(2){ animation-delay:.58s; }
  .feat-strip .feat-card:nth-child(3){ animation-delay:.66s; }
  .feat-strip .feat-card:nth-child(4){ animation-delay:.74s; }

  .scan-overlay{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1;}
  .scan-line{ position:absolute; left:0; right:0; height:40%; background:linear-gradient(180deg, transparent, rgba(63,174,99,.45), transparent); animation:scanMove 1.15s linear infinite; }
  .analyzing{ animation:pulseSoft 0.9s ease-in-out infinite alternate; }

  .confidence-fill{ animation: fillBar 1.1s cubic-bezier(.2,.8,.2,1) forwards; width:0; }

  .chart-path{ animation:drawPath 1.2s ease forwards; }
  .chart-dot{ opacity:0; animation:popIn .3s ease forwards; }

  .bar-rect{ transform-box:fill-box; transform-origin:bottom; transform:scaleY(0); animation:growBar .55s cubic-bezier(.2,.8,.2,1) forwards; }
  .donut-seg{ opacity:0; animation:fadeIn .5s ease forwards; animation-delay:.2s; }

  .modal-overlay{ animation:fadeIn .18s ease; }
  .modal{ animation:modalIn .22s cubic-bezier(.2,.8,.2,1); }

  .thumb{ opacity:0; animation:fadeSlideUp .4s ease forwards; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
/* ======================= STORAGE / "DATABASE" LAYER ======================= */
const DB_KEY_RECORDS = 'cropvision:records';
const DB_KEY_CLASS = 'cropvision:classification-history';
const DB_KEY_SETTINGS = 'cropvision:settings';

async function dbGet(key, fallback){
  try{
    const r = await window.storage.get(key, false);
    if(r && r.value !== undefined) return JSON.parse(r.value);
    return fallback;
  }catch(e){ return fallback; }
}
async function dbSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), false); }
  catch(e){ console.error('storage set failed', e); }
}

function uid(){ return 'r' + Math.random().toString(36).slice(2,10); }

function seedRecords(){
  return [
    { id: uid(), crop:'Tomato', variety:'Registered Variety A', datePlanted:'2027-01-15', plantCount:9,
      growthStage:'Fruiting', ripeness:'Ripe', status:'Ready', height:62, leafCount:24, healthStatus:'Healthy',
      trend:[{w:'Week 1',h:8},{w:'Week 2',h:19},{w:'Week 3',h:31},{w:'Week 4',h:44},{w:'Week 5',h:55},{w:'Week 6',h:62}] },
    { id: uid(), crop:'Tomato', variety:'Registered Variety B', datePlanted:'2027-02-01', plantCount:7,
      growthStage:'Flowering', ripeness:'Near Ripe', status:'Monitoring', height:38, leafCount:17, healthStatus:'Healthy',
      trend:[{w:'Week 1',h:6},{w:'Week 2',h:14},{w:'Week 3',h:22},{w:'Week 4',h:29},{w:'Week 5',h:34},{w:'Week 6',h:38}] },
    { id: uid(), crop:'Eggplant', variety:'Registered Variety A', datePlanted:'2027-01-20', plantCount:5,
      growthStage:'Fruiting', ripeness:'Ripe', status:'Ready', height:58, leafCount:21, healthStatus:'Healthy',
      trend:[{w:'Week 1',h:9},{w:'Week 2',h:20},{w:'Week 3',h:33},{w:'Week 4',h:45},{w:'Week 5',h:52},{w:'Week 6',h:58}] },
    { id: uid(), crop:'Eggplant', variety:'Registered Variety B', datePlanted:'2027-02-10', plantCount:3,
      growthStage:'Vegetative', ripeness:'Unripe', status:'Monitoring', height:22, leafCount:12, healthStatus:'Healthy',
      trend:[{w:'Week 1',h:4},{w:'Week 2',h:9},{w:'Week 3',h:14},{w:'Week 4',h:18},{w:'Week 5',h:20},{w:'Week 6',h:22}] },
  ];
}

/* ======================= APP STATE ======================= */
let state = {
  page: 'home',
  monitorCrop: 'Tomato',
  classifyCrop: 'Tomato',
  analyticsTab: 'growth',
  records: [],
  classifications: [],
  settings: { farmerName: 'Juan Dela Cruz' },
  modal: null,        // {type:'add'|'edit', record}
  selectedRecordId: null,
  lastClassification: null,
  loaded: false,
};

async function loadAll(){
  let recs = await dbGet(DB_KEY_RECORDS, null);
  if(!recs){ recs = seedRecords(); await dbSet(DB_KEY_RECORDS, recs); }
  state.records = recs;
  state.classifications = await dbGet(DB_KEY_CLASS, []);
  state.settings = await dbGet(DB_KEY_SETTINGS, state.settings);
  state.loaded = true;
}
async function saveRecords(){ await dbSet(DB_KEY_RECORDS, state.records); }
async function saveClassifications(){ await dbSet(DB_KEY_CLASS, state.classifications); }
async function saveSettings(){ await dbSet(DB_KEY_SETTINGS, state.settings); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function goTo(page){ state.page = page; render(); window.scrollTo(0,0); }
window.goTo = goTo;

/* ======================= SVG ICONS ======================= */
const ICONS = {
  leaf:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 4C10 4 4 10 4 18c0 1.1.9 2 2 2 8 0 14-6 14-16Z" stroke="currentColor" stroke-width="1.6"/><path d="M5 19 15 9" stroke="currentColor" stroke-width="1.6"/></svg>`,

/* ======================= HELPERS ======================= */
function tagFor(kind, value){
  const map = {
    ripeness: {Ripe:'tag-ripe', 'Near Ripe':'tag-near', Unripe:'tag-unripe'},
    status: {Ready:'tag-ready', Monitoring:'tag-monitoring'},
    stage: {Fruiting:'tag-fruiting', Flowering:'tag-flowering', Vegetative:'tag-vegetative', Seedling:'tag-vegetative'},
    health: {Healthy:'tag-healthy', 'Needs Attention':'tag-attention'},
  };
  const cls = (map[kind] && map[kind][value]) || 'tag-vegetative';
  return `<span class="tag ${cls}">${value}</span>`;
}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'});
}
function cropEmoji(c){ return c==='Tomato' ? '🍅' : '🍆'; }
function daysSince(iso){
  const d = new Date(iso+'T00:00:00'); const now = new Date();
  return Math.max(0, Math.round((now-d)/86400000));
}
function stageFromHeight(h){
  if(h < 12) return 'Seedling';
  if(h < 30) return 'Vegetative';
  if(h < 50) return 'Flowering';
  return 'Fruiting';
}
function activePlants(){ return state.records.reduce((s,r)=>s+r.plantCount,0); }
function ripeCropsCount(){ return state.records.filter(r=>r.ripeness==='Ripe').reduce((s,r)=>s+r.plantCount,0); }
function monitoringPlots(){ return state.records.filter(r=>r.status==='Monitoring').length; }

function harvestWindow(ripeness){
  if(ripeness==='Ripe') return {label:'Within 1–3 days', days:2};
  if(ripeness==='Near Ripe') return {label:'Within 4–6 days', days:5};
  return {label:'Within 10–14 days', days:12};
}

/* ======================= SVG CHARTS (vanilla) ======================= */
function svgLineChart(points, opts){
  opts = opts||{};
  const w = opts.w||520, h = opts.h||190, pad=32;
  const maxV = Math.max(10, ...points.map(p=>p.h)) * 1.15;
  const stepX = (w - pad*1.4) / Math.max(1, points.length-1);
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h - pad*0.7 - (p.h/maxV)*(h - pad*1.4);
    return {x,y,...p};
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const area = path + ` L${coords[coords.length-1].x.toFixed(1)},${h-pad*0.7} L${coords[0].x.toFixed(1)},${h-pad*0.7} Z`;
  const gridY = [0,0.25,0.5,0.75,1].map(f=> h-pad*0.7 - f*(h-pad*1.4));
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">`;
  gridY.forEach(y=>{ svg += `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-8}" y2="${y.toFixed(1)}" stroke="#eef3ef" stroke-width="1"/>`; });
  svg += `<path d="${area}" fill="url(#lg1)" opacity="0.5"/>`;
  svg += `<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2e9153" stop-opacity="0.35"/><stop offset="100%" stop-color="#2e9153" stop-opacity="0.02"/></linearGradient></defs>`;
  svg += `<path class="chart-path" d="${path}" fill="none" stroke="#1b5e3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`;
  coords.forEach((c,i)=>{ svg += `<circle class="chart-dot" style="animation-delay:${(1.2+i*0.08).toFixed(2)}s" cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.6" fill="#fff" stroke="#1b5e3a" stroke-width="2"/>`; });
  coords.forEach(c=>{ svg += `<text x="${c.x.toFixed(1)}" y="${h-8}" font-size="10.5" fill="#5b6b62" text-anchor="middle">${c.w.replace('Week','W')}</text>`; });
  svg += `</svg>`;
  return svg;
}

function svgBarChart(categories, series){
  const w = 520, h = 220, pad=34;
  const maxV = Math.max(10, ...series.flatMap(s=>s.values)) * 1.2;
  const groupW = (w - pad*1.5) / categories.length;
  const barW = Math.min(16, groupW/(series.length+1.4));
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">`;
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const y = h-pad - f*(h-pad*1.6);
    svg += `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-6}" y2="${y.toFixed(1)}" stroke="#eef3ef" stroke-width="1"/>`;
  });
  categories.forEach((cat,i)=>{
    const gx = pad + i*groupW + groupW/2;
    series.forEach((s,si)=>{
      const val = s.values[i];
      const bh = (val/maxV)*(h-pad*1.6);
      const bx = gx - (series.length*barW)/2 + si*barW + 2;
      const by = h-pad-bh;
      const delay = (i*series.length+si)*0.04;
      svg += `<rect class="bar-rect" style="animation-delay:${delay.toFixed(2)}s" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(barW-3).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${s.color}"/>`;
    });
    svg += `<text x="${gx.toFixed(1)}" y="${h-10}" font-size="10.5" fill="#5b6b62" text-anchor="middle">${cat}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function svgDonut(segments){
  const size=150, r=54, cx=size/2, cy=size/2, sw=20;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let acc = -90; let segIdx = 0;
  let svg = `<svg viewBox="0 0 ${size} ${size}" width="150" height="150">`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef3ef" stroke-width="${sw}"/>`;
  segments.forEach(seg=>{
    const frac = seg.value/total;
    const deg = frac*360;
    const large = deg>180?1:0;
    const startRad = acc*Math.PI/180, endRad=(acc+deg)*Math.PI/180;
    const x1 = cx + r*Math.cos(startRad), y1 = cy + r*Math.sin(startRad);
    const x2 = cx + r*Math.cos(endRad), y2 = cy + r*Math.sin(endRad);
    if(frac>0.001){
      svg += `<path class="donut-seg" style="animation-delay:${(segIdx*0.12).toFixed(2)}s" d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-linecap="butt"/>`;
    }
    acc += deg; segIdx++;
  });
  const pct = Math.round((segments[0].value/total)*100);
  svg += `<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="700" fill="#16241c" font-family="Iowan Old Style, Georgia, serif">${pct}%</text>`;
  svg += `<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9.5" fill="#5b6b62">${segments[0].label}</text>`;
  svg += `</svg>`;
  return svg;
}

function classifyImageColors(cropType, imgEl){
  const canvas = document.createElement('canvas');
  const w = 60, h = 60;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgEl, 0, 0, w, h);
  let data;
  try{ data = ctx.getImageData(0,0,w,h).data; } catch(e){ data = null; }
  let r=0,g=0,b=0,n=0;
  if(data){
    for(let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
    r/=n; g/=n; b/=n;
  } else { r=150;g=90;b=90; }

  if(cropType==='Tomato'){
    const redRatio = r/(r+g+b+0.0001);
    let ripeness, confidence;
    if(redRatio > 0.40 && r > g*1.15){ ripeness='Ripe'; confidence = Math.min(98, Math.round(80 + (redRatio-0.40)*180)); }
    else if(redRatio > 0.35){ ripeness='Near Ripe'; confidence = Math.min(95, Math.round(72 + (redRatio-0.35)*160)); }
    else { ripeness='Unripe'; confidence = Math.min(95, Math.round(75 + (0.35-Math.min(redRatio,0.35))*140)); }
    return {ripeness, confidence: Math.max(70, confidence)};
  } else {
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    const lightness = (max+min)/2/255;
    let hue = 0;
    if(max!==min){
      const d = max-min;
      if(max===r) hue = ((g-b)/d) % 6;
      else if(max===g) hue = (b-r)/d + 2;
      else hue = (r-g)/d + 4;
      hue *= 60; if(hue<0) hue+=360;
    }
    const isPurpleHue = hue > 250 && hue < 335;
    let ripeness, confidence;
    if(isPurpleHue && lightness < 0.32){ ripeness='Ripe'; confidence = Math.min(98, Math.round(85 + (0.32-lightness)*100)); }
    else if(isPurpleHue && lightness < 0.5){ ripeness='Near Ripe'; confidence = Math.min(93, Math.round(75 + (0.5-lightness)*80)); }
    else { ripeness='Unripe'; confidence = Math.min(93, Math.round(74 + Math.max(0,lightness-0.5)*80)); }
    return {ripeness, confidence: Math.max(70, confidence)};
  }
}

window.handleClassifyUpload = (ev)=>{
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const dataUrl = reader.result;
    state.classifyProcessing = { _img: dataUrl };
    state.lastClassification = null;
    render();
    const img = new Image();
    img.onload = ()=>{
      setTimeout(async ()=>{
        const result = classifyImageColors(state.classifyCrop, img);
        const record = {
          id: uid(), crop: state.classifyCrop, ripeness: result.ripeness, confidence: result.confidence,
          date: new Date().toISOString().slice(0,10), _img: dataUrl
        };
        state.classifyProcessing = null;
        state.lastClassification = record;
        state.classifications.unshift({...record});
        state.classifications = state.classifications.slice(0,20);
        await saveClassifications();
        render();
        showToast('Classified as '+result.ripeness+' ('+result.confidence+'% confidence)');
      }, 900);
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
};

function weeklyAverage(crop){
  const recs = state.records.filter(r=>r.crop===crop);
  const weeks = 6;
  const out = [];
  for(let i=0;i<weeks;i++){
    const vals = recs.map(r=> (r.trend[i]? r.trend[i].h : r.trend[r.trend.length-1]?.h) || 0).filter(v=>v!==undefined);
    out.push(vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0);
  }
  return out;
}

  rec.height = height; rec.leafCount = leafCount; rec.healthStatus = healthStatus;
  rec.growthStage = stageFromHeight(height);
  const weekNum = rec.trend.length+1;
  rec.trend.push({w:'Week '+weekNum, h:height});
  if(rec.trend.length>8) rec.trend = rec.trend.slice(-8);
  await saveRecords();
  state.modal = null; render();
  showToast('Measurement logged — stage updated to '+rec.growthStage);
};

/* ======================= MAIN RENDER ======================= */
function render(){
  const root = document.getElementById('root');
  let html = '';
  if(!state.loaded){
    root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:sans-serif;">Loading CropVision…</div>`;
    return;
  }
  switch(state.page){
    case 'home': html = renderHome(); break;
    case 'about': html = renderAbout(); break;
    case 'dashboard': html = renderDashboard(); break;
    case 'monitoring': html = renderMonitoring(); break;
    case 'classification': html = renderClassification(); break;
    case 'records': html = renderRecords(); break;
    case 'analytics': html = renderAnalytics(); break;
    case 'harvest': html = renderHarvest(); break;
    case 'settings': html = renderSettings(); break;
    default: html = renderHome();
  }
  root.innerHTML = html + renderModal();
  postRenderEffects();
}

function postRenderEffects(){
  if(state.page==='dashboard'){
    document.querySelectorAll('.num[data-count]').forEach(el=>{
      const target = parseInt(el.getAttribute('data-count'),10)||0;
      let start=null; const dur=650;
      function step(ts){
        if(!start) start=ts;
        const p = Math.min(1,(ts-start)/dur);
        el.textContent = Math.round(target*(1-Math.pow(1-p,3)));
        if(p<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }
}

/* ======================= INIT ======================= */
(async function init(){
  await loadAll();
  render();
})();
</script>
</body>
</html>
